name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: file target/release/zyabra
      - run: target/release/zyabra --help
      - uses: actions/upload-artifact@v4
        with:
          name: zyabra-macos
          path: target/release/zyabra

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse network APIs in the program
        shell: bash
        run: |
          if grep -RInE 'TcpStream|UdpSocket|reqwest|hyper::|WinHttp|InternetOpen|HttpClient' src build.rs Cargo.toml; then
            echo "network API is not allowed"
            exit 1
          fi
